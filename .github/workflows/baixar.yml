name: Baixar relatorios Sicredi

# O agendamento automatico foi DESLIGADO: rodando do servidor do GitHub, o
# portal do Sicredi barra com o "prove que voce e humano" (CAPTCHA), que so a
# pessoa resolve. O caminho que funciona e rodar no PC (BAIXAR-WINDOWS.bat).
# Fica so o botao manual, para eventual reteste.
on:
  workflow_dispatch:          # botao manual (so para teste)

# precisa poder gravar os arquivos baixados de volta no repositorio
permissions:
  contents: write

# nao deixa duas execucoes ao mesmo tempo
concurrency:
  group: baixar-sicredi
  cancel-in-progress: false

jobs:
  baixar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Pegar o codigo do repositorio
        uses: actions/checkout@v4

      - name: Preparar o Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar as dependencias
        run: npm install

      - name: Instalar o navegador (Chromium)
        run: npx playwright install --with-deps chromium

      - name: Baixar os relatorios
        env:
          MODO: ci
          SICREDI_CONTAS: ${{ secrets.SICREDI_CONTAS }}
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
        run: npm run baixar

      - name: Guardar os arquivos no repositorio
        if: always()
        run: |
          git config user.name  "robo-relatorios"
          git config user.email "robo@gruporagga.com.br"
          git add relatorios/ || true
          if git diff --staged --quiet; then
            echo "Nada novo para guardar."
          else
            git commit -m "Relatorios Sicredi de $(date +%d-%m-%Y)"
            git push
          fi
